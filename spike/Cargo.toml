[package]
name = "ncm-spike"
version = "0.1.0"
edition = "2021"

# ADR-0006 的可行性验证。只回答一个问题：
# Rust 能不能原生跑通 weapi/eapi 加密 → 扫码登录 → 取 exhigh 直链 → 落盘确实是 mp3。
# 这不是产品代码，验证完即并入正式工程。

[dependencies]
# 必须用 rustls 而非默认的 native-tls：后者走 macOS Security.framework，
# 证书验证时访问 keychain 会在受限环境下挂成不可中断等待，连超时都不触发。
reqwest = { version = "0.12", default-features = false, features = [
    "blocking", "json", "rustls-tls",
] }
serde_json = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
num-bigint = "0.4"
hex = "0.4"
md-5 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
anyhow = "1"
