name: 构建桌面应用

# Tauri 官方不支持从 macOS 交叉编译到 Windows（需要 MSVC 工具链、WebView2、
# 以及只能在 Windows 上运行的 NSIS/WiX 打包器）。因此 Windows 版本在
# GitHub 的 Windows runner 上原生构建。

on:
  # 手动触发：产物作为 artifact 上传，可直接下载
  workflow_dispatch:
  # 打 v 开头的 tag：额外创建一个 Release 草稿
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows-x64
            args: ""
          - platform: macos-latest
            label: macos-universal
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 出通用二进制，需要两个架构的 target
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # rusqlite 用的是 bundled 特性，会现编译 SQLite 源码，缓存能省下大量时间
      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      - name: 构建并打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          # 仅在打 tag 时创建 Release；手动触发只产出 artifact
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('网易云音乐下载器 {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
